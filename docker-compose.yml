services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: youface
      POSTGRES_USER: youface
      POSTGRES_PASSWORD: youface_dev_password
    ports:
      - "5432:5432"
    volumes:
      - youface_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youface -d youface"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - youface_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: youface
      MINIO_ROOT_PASSWORD: youface_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - youface_minio:/data

volumes:
  youface_postgres:
  youface_redis:
  youface_minio:
