<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Content Automation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">📱 Social Content</div>
    <div class="nav-links">
      <a href="index.html" class="active">Posts</a>
      <a href="ai.html">Génération IA</a>
    </div>
    <div id="statusIndicators" class="status-bar"></div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Mes Posts</h1>
      <button class="btn btn-primary" onclick="openModal()">+ Nouveau post</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-status="all">Tous</button>
      <button class="filter-btn" data-status="draft">Brouillons</button>
      <button class="filter-btn" data-status="scheduled">Planifiés</button>
      <button class="filter-btn" data-status="published">Publiés</button>
    </div>

    <div id="postsList" class="posts-grid"></div>
  </main>

  <!-- Modal Création -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nouveau post</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <form id="postForm">
        <div class="form-group">
          <label>Titre</label>
          <input type="text" id="postTitle" placeholder="Titre du post" required>
        </div>
        <div class="form-group">
          <label>Contenu</label>
          <textarea id="postContent" rows="4" placeholder="Votre contenu..."></textarea>
        </div>
        <div class="form-group">
          <label>Hashtags (séparés par des virgules)</label>
          <input type="text" id="postHashtags" placeholder="marketing, contenu, viral">
        </div>
        <div class="form-group">
          <label>URL image (optionnel)</label>
          <input type="url" id="postImageUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Plateformes</label>
          <div class="platforms-check">
            <label><input type="checkbox" value="instagram"> Instagram</label>
            <label><input type="checkbox" value="tiktok"> TikTok</label>
            <label><input type="checkbox" value="youtube"> YouTube</label>
            <label><input type="checkbox" value="facebook"> Facebook</label>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
          <button type="submit" class="btn btn-primary">Sauvegarder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Email -->
  <div id="emailModal" class="modal hidden">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Envoyer par email</h2>
        <button class="close-btn" onclick="closeEmailModal()">×</button>
      </div>
      <div class="form-group">
        <label>Email destinataire</label>
        <input type="email" id="emailTo" placeholder="destinataire@email.com">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeEmailModal()">Annuler</button>
        <button class="btn btn-primary" onclick="confirmSendEmail()">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- Modal Planification -->
  <div id="scheduleModal" class="modal hidden">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Planifier la publication</h2>
        <button class="close-btn" onclick="closeScheduleModal()">×</button>
      </div>
      <div class="form-group">
        <label>Date et heure</label>
        <input type="datetime-local" id="scheduleTime">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeScheduleModal()">Annuler</button>
        <button class="btn btn-primary" onclick="confirmSchedule()">Planifier</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
